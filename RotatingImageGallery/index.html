<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="image-container">
        <span style="--i: 1">
            <img src="./hands1.jpg" alt="hands">
        </span>
        <span style="--i: 2">
            <img src="./hands2.jpg" alt="hands">
        </span>
        <span style="--i: 3">
            <img src="./hands3.jpg" alt="hands">
        </span>
        <span style="--i: 4">
            <img src="./hands4.jpg" alt="hands">
        </span>
        <span style="--i: 5">
            <img src="./hands5.jpg" alt="hands">
        </span>
        <span style="--i: 6">
            <img src="./hands6.jpg" alt="hands">
        </span>
        <span style="--i: 7">
            <img src="./hands7.jpg" alt="hands">
        </span>
        <span style="--i: 8">
            <img src="./hands8.jpg" alt="hands">
        </span>
    </div>
    <div class="btn-container">
        <button class="btn" id="prev">Prev</button>
        <button class="btn" id="next">Next</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
