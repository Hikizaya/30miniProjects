<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Trailer Popup</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="main-container">
      <img src="./movieProjector.jpg" alt="movie-image" />
      <h1>Movie Title</h1>
      <p>
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Doloremque,
        repudiandae veritatis, omnis expedita, nemo voluptate blanditiis officia
        vel aliquam at rerum! Id sed vitae veniam? Cupiditate incidunt harum
        suscipit laborum?
      </p>
      <button class="btn">Watch now</button>
    </div>

    <div class="trailer-container active">
      <video src="./watchingMovie.mp4" controls></video>
      <i class="fa-solid fa-xmark fa-2x close-icon"></i>
    </div>

    <script src="script.js"></script>
  </body>
</html>
